<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Dark background -->
  <rect width="64" height="64" rx="12" fill="#0b0b12"/>
  <!-- Lime-green crescent shape (larger arc) -->
  <mask id="c1">
    <rect width="64" height="64" fill="#000"/>
    <circle cx="32" cy="32" r="22" fill="#fff"/>
    <circle cx="43" cy="32" r="17" fill="#000"/>
  </mask>
  <rect width="64" height="64" fill="#84cc16" mask="url(#c1)"/>
  <!-- Smaller inner arc -->
  <mask id="c2">
    <rect width="64" height="64" fill="#000"/>
    <circle cx="24" cy="32" r="14" fill="#fff"/>
    <circle cx="32" cy="32" r="11" fill="#000"/>
  </mask>
  <rect width="64" height="64" fill="#84cc16" mask="url(#c2)"/>
  <!-- Red dot accent -->
  <circle cx="13" cy="32" r="6" fill="#ef4444"/>
</svg>
